---
# role: alloy
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install and configure the Grafana Alloy systemd service.
    options:
      alloy_backup:
        type: bool
        default: true
        description: Back up managed configuration files before replacing them.
      alloy_config:
        type: str
        default: prometheus.exporter.self "local" {}
        no_log: true
        description: Complete configuration file in native Alloy syntax.
      alloy_reporting_enabled:
        type: bool
        default: false
        description: Send Alloy's anonymous usage statistics to Grafana Labs.
