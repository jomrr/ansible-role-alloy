---
# role: alloy
# file: tasks/install-Debian.yml

- name: install-Debian | Install the Python library for Deb822 repositories
  ansible.builtin.import_tasks: install-apt.yml
  vars:
    __alloy_apt_packages: [python3-debian]
    __alloy_apt_archive: ' Packages'
    __alloy_apt_refresh: false

- name: install-Debian | Check whether the Deb822 library is available after installation
  ansible.builtin.stat:
    path: /usr/lib/python3/dist-packages/debian/deb822.py
    get_checksum: false
    get_mime: false
  register: __alloy_deb822_library

- name: install-Debian | Configure the signed Grafana APT repository
  become: true
  become_user: root
  ansible.builtin.deb822_repository:
    name: grafana
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key
  register: __alloy_apt_repository
  when: __alloy_deb822_library.stat.exists

- name: install-Debian | Check whether APT can read the configured repository
  ansible.builtin.stat:
    path: "{{ __alloy_apt_repository.dest }}"
    get_checksum: false
    get_mime: false
  register: __alloy_apt_source
  when: __alloy_apt_repository is not skipped

- name: install-Debian | Prefer the Grafana build of Alloy
  become: true
  become_user: root
  ansible.builtin.template:
    src: apt-preferences.j2
    dest: /etc/apt/preferences.d/grafana-alloy
    owner: root
    group: root
    mode: '0644'
    backup: "{{ alloy_backup }}"

- name: install-Debian | Install Alloy and the kill executable used by its reload command
  ansible.builtin.include_tasks: install-apt.yml
  vars:
    __alloy_apt_packages: [alloy, procps]
    __alloy_apt_archive: ' https://apt.grafana.com '
    __alloy_apt_refresh: "{{ __alloy_apt_repository.changed }}"
  when:
    - __alloy_apt_source is not skipped
    - __alloy_apt_source.stat.exists
