---
# role: alloy
# file: tasks/main.yml

- name: ALLOY | Trust the Grafana RPM signing key
  become: true
  become_user: root
  ansible.builtin.rpm_key:
    key: https://rpm.grafana.com/gpg.key
    fingerprint: B53AE77BADB630A683046005963FA27710458545
    state: present
  when: ansible_facts.os_family in ['RedHat', 'Suse']

- name: ALLOY | Install the official Grafana package for this platform
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family }}.yml"

- name: ALLOY | Restrict writes to the configuration directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    owner: root
    group: alloy
    mode: '0750'

- name: ALLOY | Validate and install the collector configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'
    validate: /usr/bin/alloy validate %s
  no_log: true
  diff: false
  notify: ALLOY | Reload Alloy

- name: ALLOY | Apply the configuration before enforcing the service state
  ansible.builtin.meta: flush_handlers

- name: ALLOY | Enable and start Alloy
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: alloy.service
    enabled: true
    state: started
