---
# role: alloy
# file: tasks/main.yml

- name: ALLOY | Install Grafana Alloy
  ansible.builtin.import_tasks: install.yml

- name: ALLOY | Restrict writes to the configuration directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    owner: root
    group: alloy
    mode: '0750'

- name: ALLOY | Validate and install the collector configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'
    validate: /usr/bin/alloy validate %s
  no_log: true
  diff: false
  notify: ALLOY | Apply service changes

- name: ALLOY | Create the systemd drop-in directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: ALLOY | Identify packages using the Alloy startup wrapper
  ansible.builtin.stat:
    path: /usr/lib/alloy/alloy-wrapper
    get_checksum: false
    get_mime: false
  register: __alloy_wrapper

- name: ALLOY | Install the systemd sandbox and usage reporting policy
  become: true
  become_user: root
  ansible.builtin.template:
    src: sandbox.conf.j2
    dest: /etc/systemd/system/alloy.service.d/10-ansible.conf
    owner: root
    group: root
    mode: '0644'
  register: __alloy_dropin
  notify: ALLOY | Apply service changes

- name: ALLOY | Apply the configuration before enforcing the service state
  ansible.builtin.meta: flush_handlers

- name: ALLOY | Enable and start Alloy
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: alloy.service
    enabled: true
    state: started
