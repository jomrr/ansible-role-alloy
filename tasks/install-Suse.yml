---
# role: alloy
# file: tasks/install-Suse.yml

- name: install-Suse | Configure the signed Grafana Zypper repository
  become: true
  become_user: root
  community.general.zypper_repository:
    name: grafana
    repo: "{{ __alloy_rpm_repository_url }}"
    enabled: true
    autorefresh: true
    disable_gpg_check: false
  register: __alloy_zypper_repository

- name: install-Suse | Check the effective Grafana repository in check mode
  community.general.zypper_repository_info:
  register: __alloy_zypper_preview
  changed_when: >-
    not (__alloy_zypper_preview.repodatalist
         | selectattr('alias', 'equalto', 'grafana')
         | selectattr('url', 'in', [__alloy_rpm_repository_url, __alloy_rpm_repository_url ~ '/'])
         | selectattr('enabled', 'equalto', '1')
         | selectattr('autorefresh', 'equalto', '1')
         | selectattr('gpgcheck', 'equalto', '1')
         | list)
  when: __alloy_zypper_repository is skipped

- name: install-Suse | Install Alloy from the Grafana Zypper repository
  become: true
  become_user: root
  community.general.zypper:
    name: alloy
    state: present
    extra_args: --repo grafana
  when: __alloy_zypper_preview is not changed
