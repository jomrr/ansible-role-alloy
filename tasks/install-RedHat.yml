---
# role: alloy
# file: tasks/install-RedHat.yml

- name: ALLOY | Configure the signed Grafana DNF repository
  become: true
  become_user: root
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana Labs
    baseurl: https://rpm.grafana.com
    gpgkey: https://rpm.grafana.com/gpg.key
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true
    mode: '0644'

- name: ALLOY | Install Alloy from the Grafana DNF repository
  become: true
  become_user: root
  ansible.builtin.dnf:
    name: alloy
    state: present
    disablerepo: '*'
    enablerepo: grafana
