---
# role: alloy
# file: molecule/resources/playbooks/prepare_install.yml

- name: ALLOY | Prepare platform package metadata
  ansible.builtin.import_playbook: prepare.yml

- name: ALLOY | Exercise the standalone installer on fresh hosts
  hosts: all
  gather_facts: false
  vars:
    # The standalone installer must not validate or deploy a pipeline.
    alloy_config: 'not a valid Alloy configuration'
  tasks:
    - name: ALLOY | Empty the Debian test container's package lists
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/lib/apt/lists
        state: absent
      when: ansible_facts.distribution == 'Debian'

    - name: ALLOY | Provide an empty directory for Debian package lists
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/lib/apt/lists
        state: directory
        mode: '0755'
      when: ansible_facts.distribution == 'Debian'

    - name: ALLOY | Leave Ubuntu with a configured Grafana source and no vendor index
      become: true
      become_user: root
      ansible.builtin.deb822_repository:
        name: grafana
        uris: https://apt.grafana.com
        suites: stable
        components: main
        signed_by: https://apt.grafana.com/gpg.key
        install_python_debian: true
      when: ansible_facts.distribution == 'Ubuntu'

    - name: ALLOY | Seed a disabled and misconfigured Grafana repository on openSUSE
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/zypp/repos.d/grafana.repo
        mode: '0644'
        content: |
          [grafana]
          name=Grafana
          baseurl=file:///missing-alloy-molecule-repository
          enabled=0
          autorefresh=0
          gpgcheck=0
      when: ansible_facts.os_family == 'Suse'

    - name: ALLOY | Clear cached facts before calling the standalone installer
      ansible.builtin.meta: clear_facts

    - name: ALLOY | Preview installation
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: install
        apply:
          check_mode: true

    - name: ALLOY | Look for the binary after the dry run
      ansible.builtin.stat:
        path: /usr/bin/alloy
      register: __alloy_preview_binary

    - name: ALLOY | Verify the dry run left the host uninstalled
      ansible.builtin.assert:
        that: not __alloy_preview_binary.stat.exists
        quiet: true

    - name: ALLOY | Look for Grafana indexes after the dry run
      ansible.builtin.find:
        paths: /var/lib/apt/lists
        patterns: 'apt.grafana.com_*'
      register: __alloy_preview_indexes
      when: ansible_facts.os_family == 'Debian'

    - name: ALLOY | Verify the dry run deferred the APT index update
      ansible.builtin.assert:
        that: __alloy_preview_indexes.matched == 0
        quiet: true
      when: ansible_facts.os_family == 'Debian'

    - name: ALLOY | Install the package without configuring the collector
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: install

    - name: ALLOY | Run the installed binary
      ansible.builtin.command: /usr/bin/alloy --version
      register: __alloy_installed_version
      changed_when: false
      failed_when: __alloy_installed_version.rc != 0

    - name: ALLOY | Look up the packaged service account
      ansible.builtin.getent:
        database: passwd
        key: alloy

    - name: ALLOY | Inspect the installed unit
      ansible.builtin.systemd_service:
        name: alloy.service
        state: started
      check_mode: true
      register: __alloy_installed_unit

    - name: ALLOY | Verify installation left the service inactive and disabled
      ansible.builtin.assert:
        that:
          - __alloy_installed_unit.status.ActiveState == 'inactive'
          - __alloy_installed_unit.status.UnitFileState == 'disabled'
          - "'/etc/systemd/system/alloy.service.d/10-ansible.conf' not in (__alloy_installed_unit.status.DropInPaths | default(''))"
        quiet: true
