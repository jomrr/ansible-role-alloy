---
# role: alloy
# file: molecule/resources/playbooks/prepare_install.yml

- name: ALLOY | Prepare platform package metadata
  ansible.builtin.import_playbook: prepare.yml

- name: ALLOY | Exercise the standalone installer on fresh hosts
  hosts: all
  gather_facts: true
  vars:
    # The standalone installer must not validate or deploy a pipeline.
    alloy_config: 'not a valid Alloy configuration'
  tasks:
    - name: ALLOY | Preview installation
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: install
        apply:
          check_mode: true

    - name: ALLOY | Look for the binary after the dry run
      ansible.builtin.stat:
        path: /usr/bin/alloy
      register: __alloy_preview_binary

    - name: ALLOY | Verify the dry run left the host uninstalled
      ansible.builtin.assert:
        that: not __alloy_preview_binary.stat.exists
        quiet: true

    - name: ALLOY | Install the package without configuring the collector
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: install

    - name: ALLOY | Run the installed binary
      ansible.builtin.command: /usr/bin/alloy --version
      changed_when: false

    - name: ALLOY | Look up the packaged service account
      ansible.builtin.getent:
        database: passwd
        key: alloy

    - name: ALLOY | Inspect the installed unit
      ansible.builtin.systemd_service:
        name: alloy.service
        state: started
      check_mode: true
      register: __alloy_installed_unit

    - name: ALLOY | Verify installation left the service inactive and disabled
      ansible.builtin.assert:
        that:
          - __alloy_installed_unit.status.ActiveState == 'inactive'
          - __alloy_installed_unit.status.UnitFileState == 'disabled'
          - "'/etc/systemd/system/alloy.service.d/10-ansible.conf' not in (__alloy_installed_unit.status.DropInPaths | default(''))"
        quiet: true
