---
# role: alloy
# file: molecule/resources/playbooks/side_effect.yml

- name: ALLOY | Verify pipeline reload and reporting opt-in
  hosts: all
  gather_facts: true
  vars:
    alloy_config: |
      loki.source.file "sample" {
        targets    = [{__path__ = "/var/log/alloy-molecule.log"}]
        forward_to = [loki.echo.sample.receiver]
      }
      loki.echo "sample" {}
  tasks:
    - name: ALLOY | Write a sample log entry for the new pipeline
      become: true
      become_user: root
      ansible.builtin.copy:
        content: "alloy-molecule-{{ ansible_facts.date_time.epoch }}\n"
        dest: /var/log/alloy-molecule.log
        mode: '0644'

    - name: ALLOY | Record the current pipeline checksum
      become: true
      become_user: root
      ansible.builtin.stat:
        path: /etc/alloy/config.alloy
      register: __alloy_previous_pipeline

    - name: ALLOY | Configure a local file-to-journal pipeline
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Wait for the pipeline entry in the journal under the alloy identifier
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - journalctl
          - --unit=alloy.service
          - --identifier=alloy
          - --grep=alloy-molecule-{{ ansible_facts.date_time.epoch }}
          - --no-pager
      changed_when: false
      register: __alloy_journal
      failed_when: __alloy_journal.rc != 0
      until: __alloy_journal.rc == 0
      retries: 30
      delay: 2

    - name: ALLOY | Read the backups after changing the pipeline
      become: true
      become_user: root
      ansible.builtin.find:
        paths: /etc/alloy
        patterns: 'config.alloy.*~'
        get_checksum: true
      register: __alloy_pipeline_backups

    - name: ALLOY | Verify the previous pipeline was backed up
      ansible.builtin.assert:
        that: __alloy_previous_pipeline.stat.checksum in __alloy_pipeline_backups.files | map(attribute='checksum')
        quiet: true

    - name: ALLOY | Opt in to anonymous usage reporting without backing up the next pipeline
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        alloy_reporting_enabled: true
        alloy_config: 'prometheus.exporter.self "restored" {}'
        alloy_backup: false

    - name: ALLOY | Read the backups after replacing the pipeline with backups disabled
      become: true
      become_user: root
      ansible.builtin.find:
        paths: /etc/alloy
        patterns: 'config.alloy.*~'
      register: __alloy_opt_out_backups

    - name: ALLOY | Verify the second replacement kept the same backups
      ansible.builtin.assert:
        that: >-
          __alloy_opt_out_backups.files | map(attribute='path') | sort ==
          __alloy_pipeline_backups.files | map(attribute='path') | sort
        quiet: true

    - name: ALLOY | Read the current service invocation
      ansible.builtin.systemd_service:
        name: alloy.service
        state: started
      check_mode: true
      register: __alloy_opt_in_unit

    - name: Verify the opted-in usage reporter logs under the alloy identifier
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - journalctl
          - --unit=alloy.service
          - --identifier=alloy
          - _SYSTEMD_INVOCATION_ID={{ __alloy_opt_in_unit.status.InvocationID }}
          - --grep=running usage stats reporter
          - --no-pager
      changed_when: false
      register: __alloy_reporter
      failed_when: __alloy_reporter.rc != 0
      until: __alloy_reporter.rc == 0
      retries: 30
      delay: 2
